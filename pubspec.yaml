name: map2game
description: "Map2Game - Konum tabanlı oyun platformu"
publish_to: 'none'
version: 1.0.2+1

# Telif hakkı bilgisi
# Copyright (c) 2025 [Senin Adın/Şirket Adın]. Tüm hakları saklıdır.

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  equatable: ^2.0.8

  # Dependency Injection
  get_it: ^8.2.0

  # Navigation
  go_router: ^16.2.4

  # Firebase Services
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.3
  firebase_crashlytics: ^5.0.7
  firebase_messaging: ^16.0.4
  firebase_remote_config: ^6.1.3
  cloud_firestore: ^6.1.0

  # Authentication
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^7.2.0
  crypto: ^3.0.7

  # Storage & Cache
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # UI Components & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  lottie: ^3.3.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  cached_network_image: ^3.4.1

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # In-App Purchase
  purchases_flutter: ^9.10.7
  purchases_ui_flutter: ^9.10.7

  # Maps & Location
  geolocator: 14.0.1
  geocoding: ^4.0.0
  google_maps_flutter: ^2.14.0

  # Utilities
  uuid: ^4.5.2
  package_info_plus: ^9.0.0
  meta: ^1.16.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  flutter_local_notifications: ^18.0.1

  # Local Modules
  gen:
    path: module/gen
  widgets:
    path: module/widgets

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Quality
  very_good_analysis: ^9.0.0

  # Code Generation
  build_runner: ^2.9.0
  json_serializable: ^6.10.0
  freezed: ^3.2.3

flutter:
  uses-material-design: true


